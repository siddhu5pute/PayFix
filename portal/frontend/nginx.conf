server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/portal/  { proxy_pass http://portal-backend:8000/; proxy_set_header Host $host; }
  location /api/engine/  { proxy_pass http://engine:8100/;         proxy_set_header Host $host; proxy_read_timeout 120s; }
  location /api/gateway/ { proxy_pass http://mockpay:9000/;        proxy_set_header Host $host; }

  # Razorpay webhooks arrive on the public URL and go straight to the portal (raw body untouched)
  location /webhooks/    { proxy_pass http://portal-backend:8000/webhooks/; proxy_set_header Host $host; }

  location / { try_files $uri /index.html; }
}
